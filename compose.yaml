# NoteVault — Docker Compose configuration
#
# Before deploying:
# 1. Copy .env.example to .env and fill in the values
# 2. Update the bind mount paths under volumes: to match your host's filesystem
#
# Then run: docker compose up -d
services:
  db:
    image: postgres:18
    container_name: notevault-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${DB_DATA_PATH}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: docker.io/martinb03/notevault:latest
    container_name: notevault-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "${APP_PORT:-5959}:5959"
    volumes:
      - ${APP_DATA_PATH}:/root/.local-chromium